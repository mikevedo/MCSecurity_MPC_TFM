[project]
name = "poc-mcp"
version = "0.1.0"
description = "MCP Security Audit PoC — Multi-cloud CIS benchmark via Prowler CLI and LangGraph agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=0.2.40",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "mcp>=1.2",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
poc-mcp = "backend.app.chat:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
